<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">AlphaVerifier icon</title>
  <desc id="description">A rust financial icon with the classic LaTeX alpha glyph and an ascending gray market line.</desc>

  <defs>
    <linearGradient id="gloss" x1="256" y1="22" x2="256" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rim" x1="58" y1="42" x2="452" y2="466" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.28" stop-color="#E5E7EB" stop-opacity="0.2"/>
      <stop offset="0.72" stop-color="#4B5563" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.22"/>
    </linearGradient>

    <linearGradient id="marketLine" x1="82" y1="341" x2="430" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4B5563"/>
      <stop offset="1" stop-color="#D1D5DB"/>
    </linearGradient>

    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#FBFAF7" stroke-opacity="0.5" stroke-width="1"/>
    </pattern>

    <filter id="glyphGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="-24" stdDeviation="50" flood-color="#2A0F04" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#FBFAF7" flood-opacity="0.25"/>
    </filter>

    <filter id="lineGlow" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="corners">
      <rect x="18" y="18" width="476" height="476" rx="108"/>
    </clipPath>
  </defs>

  <g>
    <g clip-path="url(#corners)">
      <rect x="18" y="18" width="476" height="476" fill="#C2410C"/>
      <rect x="18" y="18" width="476" height="476" fill="url(#grid)"/>

      <path
        d="M72 350L133 312L190 331L253 249L311 266L370 188L432 148"
        fill="none"
        stroke="#9CA3AF"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path d="M446 136L406 142.3L432.3 173.5Z" fill="#9CA3AF"/>

      <!-- Exact alpha outline from Computer Modern Math Italic (cmmi10), LaTeX's classic math font. -->
      <path
        d="M412 -23Q315 -23 239.5 23Q164 69 123 147Q82 225 82 324Q82 463 159.5 599Q237 735 365.5 820Q494 905 635 905Q739 905 818 850.5Q897 796 938 705.5Q979 615 979 512L981 375Q1051 472 1099.5 576.5Q1148 681 1174 793Q1178 805 1190 805H1214Q1233 805 1233 786Q1233 784 1231 780Q1207 686 1171 599.5Q1135 513 1086.5 432Q1038 351 981 285Q981 31 1040 31Q1078 31 1102.5 53.5Q1127 76 1145.5 109Q1164 142 1169 143H1194Q1210 143 1210 123Q1210 72 1151.5 24.5Q1093 -23 1036 -23Q962 -23 913 25Q864 73 846 150Q750 68 638 22.5Q526 -23 412 -23ZM416 31Q635 31 836 211Q835 223 833 240.5Q831 258 831 260V481Q831 852 631 852Q511 852 421 749.5Q331 647 285.5 504.5Q240 362 240 244Q240 155 285.5 93Q331 31 416 31Z"
        transform="translate(113.50 355.59) scale(0.2166328125 -0.2166328125)"
        fill="#FBFAF7"
        stroke="#FBFAF7"
        stroke-width="48"
        stroke-linejoin="round"
        paint-order="stroke fill"
        filter="url(#glyphGlow)"
      />

      <path
        d="M62 28H450C474 28 490 48 490 72V155C392 205 153 190 31 120V61C31 43 44 28 62 28Z"
        fill="url(#gloss)"
      />
      <ellipse cx="146" cy="77" rx="72" ry="24" fill="#FBFAF7" fill-opacity="0.04" transform="rotate(-13 146 77)"/>
    </g>

    <rect x="19.5" y="19.5" width="473" height="473" rx="106.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
    <rect x="28" y="28" width="456" height="456" rx="99" fill="none" stroke="#3D1607" stroke-opacity="0.24" stroke-width="2"/>
  </g>
</svg>
